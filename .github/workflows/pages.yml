name: Verify and publish game
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: mkdir -p test-results
      - run: npm run test:all
      - run: node tests/phone-access.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: engineering-proofs
          path: test-results/
          if-no-files-found: warn

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Stage standalone game
        run: |
          mkdir -p test-results/pages
          cp index.html test-results/pages/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: test-results/pages
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v5

  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify deployed artifact and runtime
        run: node tools/verify-pages.mjs --url "${{ needs.deploy.outputs.page_url }}" --attempts 18 --delay-ms 10000
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: live-pages-proof
          path: test-results/pages-live/
          if-no-files-found: warn
